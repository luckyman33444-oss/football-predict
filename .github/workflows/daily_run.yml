name: Daily Football Predict

on:
  schedule:
    # 每天北京时间早上 08:00 运行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python run_daily.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions-user@users.noreply.github.com'
          git add output/
          git commit -m "Auto: 更新每日推荐报表" || echo "No changes to commit"
          git push
