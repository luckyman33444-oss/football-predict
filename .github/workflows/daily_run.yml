name: Daily Football Predict

on:
  schedule:
    # 每天北京时间 16:00 自动运行 (UTC 08:00)
    - cron: '0 8 * * *'
  workflow_dispatch: # 允许你手动点击触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交文件回仓库

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily script
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python run_daily.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git diff --staged --quiet || (git commit -m "Auto: 更新今日推荐报表 [skip ci]" && git push)