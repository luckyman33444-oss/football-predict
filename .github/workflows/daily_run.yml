name: Daily Football Predict

on:
  schedule:
    - cron: '0 7 * * *' # 北京时间 15:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python run_daily.py

      - name: Commit and Push changes (Fixed Sync Bug)
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions-user@users.noreply.github.com'
          git add output/
          git commit -m "Auto: 更新每日推荐报表 [skip ci]" || echo "No changes to commit"
          
          # 核心修复：如果推送失败，先拉取远端，再尝试推送（防止仓库有新提交导致冲突）
          git push || (git pull --rebase origin main && git push)
